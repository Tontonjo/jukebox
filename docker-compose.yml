# ============= JUKEBOX - DOCKER COMPOSE =============
# Version 1.8.0 - last updated: 1 November 2026
# Changelog:
#   1.8.0 - PRIORITY_FIRST_SONGS: first N songs of a guest go first in their round (default 1).
#   1.7.0 - MAX_SONG_MINUTES: max length of a guest song (default 8, 0 = no limit).
#   1.6.0 - SHORT_QUEUE_SONGS replaces QUOTA_WINDOW_MINUTES (quota now counts
#           pending songs, a slot is freed as soon as a song plays).
#   1.5.0 - Optional player screen effects (PLAYER_*), off by default.
#   1.4.0 - Optional YouTube Music source (YOUTUBE_ENABLED, off by default),
#           searched only when Navidrome and Soulseek find nothing.
#   1.3.2 - Sources enabled as soon as their credentials are given. Navidrome
#           credentials no longer have default values.
#   1.3.1 - NAVIDROME_ENABLED / SOULSEEK_ENABLED empty by default: each source
#           is enabled automatically when configured (see docker-entrypoint.sh).
#   1.3.0 - sockseek is built into the image: the daemon runs inside the
#           container, Soulseek account given by SOULSEEK_USER / SOULSEEK_PASS.
#           Persistent data (background music settings, Soulseek cache) kept
#           in the jukebox-data volume.
#   1.2.0 - jukebox is now the only service. Navidrome and nginx were removed:
#           they are expected to run outside this compose file (host, another
#           stack, or another machine). Comments translated to English.
#   1.1.0 - jukebox + navidrome + nginx stack.
#
# Start:  docker compose up -d
# Only the jukebox container is started by this file.

services:
  jukebox:
    build: .
    container_name: jukebox
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}

      # ----- Navidrome / Subsonic (external server) -----
      # Navidrome is not started here. Point this at wherever it actually runs.
      # host.docker.internal reaches a Navidrome running on the Docker host;
      # use a LAN address (http://192.168.1.100:4533) for another machine.
      # Empty = automatic: enabled when NAVIDROME_USER and NAVIDROME_PASS are set
      NAVIDROME_ENABLED: ${NAVIDROME_ENABLED:-}
      NAVIDROME_URL: ${NAVIDROME_URL:-http://host.docker.internal:4533}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASS: ${NAVIDROME_PASS:-}

      # ----- Soulseek (via sockseek, bundled in the image) -----
      # The jukebox starts the sockseek daemon inside the container.
      # A Soulseek account is required: set SOULSEEK_USER / SOULSEEK_PASS,
      # or SOULSEEK_ENABLED=false to use Navidrome only.
      # Empty = automatic: enabled when SOULSEEK_USER and SOULSEEK_PASS are set
      SOULSEEK_ENABLED: ${SOULSEEK_ENABLED:-}
      SOULSEEK_USER: ${SOULSEEK_USER:-}
      SOULSEEK_PASS: ${SOULSEEK_PASS:-}
      SOCKSEEK_PATH: ${SOCKSEEK_PATH:-sockseek}
      SOCKSEEK_REMOTE: ${SOCKSEEK_REMOTE:-http://127.0.0.1:5030}
      SOCKSEEK_AUTOSTART: ${SOCKSEEK_AUTOSTART:-true}
      SOULSEEK_MAX_RESULTS: ${SOULSEEK_MAX_RESULTS:-10}
      SOULSEEK_SEARCH_TIME: ${SOULSEEK_SEARCH_TIME:-20000}
      SOULSEEK_DOWNLOAD_TIMEOUT: ${SOULSEEK_DOWNLOAD_TIMEOUT:-30}
      SOULSEEK_MAX_DOWNLOADS: ${SOULSEEK_MAX_DOWNLOADS:-2}
      SOULSEEK_DELETE_AFTER_PLAY: ${SOULSEEK_DELETE_AFTER_PLAY:-true}
      SOULSEEK_RATE_LIMIT: ${SOULSEEK_RATE_LIMIT:-30}

      # ----- YouTube Music (optional, via yt-dlp bundled in the image) -----
      # Last fallback: searched only when Navidrome and Soulseek find nothing.
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-false}
      YOUTUBE_MAX_RESULTS: ${YOUTUBE_MAX_RESULTS:-10}
      YOUTUBE_SEARCH_TIMEOUT: ${YOUTUBE_SEARCH_TIMEOUT:-15}
      YOUTUBE_DOWNLOAD_TIMEOUT: ${YOUTUBE_DOWNLOAD_TIMEOUT:-120}

      # ----- Jukebox settings -----
      # Public address used for the QR code and the guest link.
      # Leave empty to let the server work it out by itself.
      PUBLIC_URL: ${PUBLIC_URL:-}
      FADE_SECONDS: ${FADE_SECONDS:-3}
      MAX_SONGS_PER_USER: ${MAX_SONGS_PER_USER:-3}
      COOLDOWN_MINUTES: ${COOLDOWN_MINUTES:-5}
      SHORT_QUEUE_SONGS: ${SHORT_QUEUE_SONGS:-2}
      MAX_SONG_MINUTES: ${MAX_SONG_MINUTES:-8}
      PRIORITY_FIRST_SONGS: ${PRIORITY_FIRST_SONGS:-1}
      SESSION_DURATION: ${SESSION_DURATION:-120}

      # ----- Player screen effects (optional, off by default) -----
      PLAYER_ADDED_BY: ${PLAYER_ADDED_BY:-false}
      PLAYER_ADD_TOAST: ${PLAYER_ADD_TOAST:-false}
      PLAYER_REACTIONS: ${PLAYER_REACTIONS:-false}
      PLAYER_STANDBY: ${PLAYER_STANDBY:-false}
      PLAYER_STANDBY_TEXT: ${PLAYER_STANDBY_TEXT:-}

      # ----- Lyrics -----
      LRCLIB_BASE: ${LRCLIB_BASE:-https://lrclib.net}

    # Lets the container reach services bound to the Docker host (Navidrome). Native on Docker Desktop; this line is what makes
    # it work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Background music settings and Soulseek cache, kept across restarts
      - jukebox-data:/app/data
      - ./jukebox-server.js:/app/jukebox-server.js:ro
      - ./qrcode.js:/app/qrcode.js:ro
      - ./public:/app/public:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jukebox-data:

# ============= QUICK START =============
# 1. Create the .env file:
#      cp .env.example .env
#      nano .env
#    Set NAVIDROME_URL to your existing Navidrome server, and
#    SOULSEEK_USER / SOULSEEK_PASS for the Soulseek fallback.
#
# 2. Start:
#      docker compose up -d
#
# 3. Open:
#      - Jukebox:       http://localhost:3000
#      - Jukebox admin: http://localhost:3000/admin
#
# Note: no reverse proxy is started here. To serve the jukebox on port 80/443,
# put nginx (or Caddy/Traefik) in front of it on the host - nginx.conf and
# nginx.ssl.conf in this folder are still valid starting points.
#
# ============= COMMANDS =============
# Logs:     docker compose logs -f
# Stop:     docker compose down
# Restart:  docker compose restart
# Rebuild:  docker compose up -d --build
