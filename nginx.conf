# Configuration Nginx pour Jukebox
# À placer dans /etc/nginx/sites-available/jukebox
# Puis créer un symlink: ln -s /etc/nginx/sites-available/jukebox /etc/nginx/sites-enabled/

upstream jukebox_backend {
    server localhost:3000;
    keepalive 64;
}

# Redirection HTTP vers HTTPS (optionnel, décommenter si SSL)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name jukebox.example.com;
#     return 301 https://$server_name$request_uri;
# }

# Serveur principal
server {
    # Configuration HTTP - Décommenter pour développement uniquement
    listen 80;
    listen [::]:80;
    
    # Configuration HTTPS avec Certbot (décommenter après setup SSL)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/jukebox.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jukebox.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    server_name jukebox.example.com;
    
    # Logs
    access_log /var/log/nginx/jukebox_access.log;
    error_log /var/log/nginx/jukebox_error.log;

    # Client max body size (pour uploads)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # ============= ROUTES STATIQUES =============
    
    # Admin
    location /admin {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Guest
    location /guest {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Player principal
    location / {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============= API =============
    
    location /api/ {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Augmenter les timeouts pour les streaming audio
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering pour le streaming
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 256 16k;
        proxy_max_temp_file_size 2048m;
        proxy_temp_file_write_size 32k;
    }

    # ============= STREAMING AUDIO =============
    
    location /api/stream/ {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts longs pour le streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        
        # Buffering pour le streaming audio
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Cache les streams (mettre en commentaire si problèmes)
        # proxy_cache_valid 200 30m;
        # add_header X-Cache-Status $upstream_cache_status;
    }

    # ============= SÉCURITÉ =============
    
    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # CORS (optionnel, à adapter selon vos besoins)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # 404 handling
    error_page 404 /index.html;
}

# Bloc pour les rate limiting (optionnel)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# limit_req_status 429;
#
# Dans le bloc server:
# location /api/ {
#     limit_req zone=api_limit burst=20 nodelay;
#     ...
# }
