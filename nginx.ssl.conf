# Configuration Nginx pour Jukebox — variante HTTPS
# Version 1.0.0 — dernière mise à jour : 11 septembre 2026
#
# Utilisation (voir SSL.md, méthode B) :
#   sudo cp nginx.ssl.conf /etc/nginx/sites-available/jukebox
#   sudo sed -i 's/jukebox\.example\.com/votre-domaine.fr/g' \
#       /etc/nginx/sites-available/jukebox
#   sudo ln -s /etc/nginx/sites-available/jukebox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prérequis : certificat déjà obtenu via
#   sudo certbot certonly --nginx -d votre-domaine.fr

upstream jukebox_backend {
    server localhost:3000;
    keepalive 64;
}

# ============= REDIRECTION HTTP → HTTPS =============
# Le port 80 doit rester ouvert : Certbot s'en sert pour renouveler.
server {
    listen 80;
    listen [::]:80;
    server_name jukebox.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============= SERVEUR HTTPS =============
server {
    # Forme compatible avec toutes les versions de Nginx.
    # Sur Nginx >= 1.25.1, la forme recommandée est :
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name jukebox.example.com;

    # ---- Certificats Let's Encrypt ----
    ssl_certificate     /etc/letsencrypt/live/jukebox.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jukebox.example.com/privkey.pem;

    # Réglages TLS fournis par Certbot (voir SSL.md, étape 3 de la méthode B)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Agrafage OCSP
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- Logs ----
    access_log /var/log/nginx/jukebox_access.log;
    error_log  /var/log/nginx/jukebox_error.log;

    client_max_body_size 50M;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # ---- En-têtes de sécurité ----
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # HSTS : à n'activer qu'une fois le HTTPS stable (mémorisé 1 an
    # par le navigateur, retour au HTTP impossible entre-temps).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============= PAGES =============

    # Panneau d'administration.
    # Décommenter pour le restreindre au réseau local (recommandé) :
    #   allow 192.168.1.0/24;
    #   deny all;
    location /admin {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /guest {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Écran de lecture
    location / {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ============= API =============

    location /api/ {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 256 16k;
        proxy_max_temp_file_size 2048m;
        proxy_temp_file_write_size 32k;
    }

    # ============= STREAMING AUDIO =============
    # Pas de buffering : les requêtes Range doivent passer telles quelles.

    location /api/stream/ {
        proxy_pass http://jukebox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ============= LIMITATION DE DÉBIT (optionnel) =============
# À placer dans le contexte http (/etc/nginx/nginx.conf) :
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
#   limit_req_status 429;
#
# Puis dans le bloc location /api/ :
#   limit_req zone=api_limit burst=20 nodelay;
